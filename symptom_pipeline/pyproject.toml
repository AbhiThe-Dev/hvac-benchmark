[project]
name = "symptom-pipeline"
version = "0.2.1"
description = "Symptom-informed ranking of HVAC topology discrepancies: a sibling package that supplies an initial suspect region to the existing hvac_benchmark Bayesian troubleshooting machinery, without modifying hvac_benchmark or physics_pipeline."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    # Pinned, not just floor-bounded: this package's oracle-parity guarantee
    # depends on hvac_benchmark's exact internal behavior, and its own
    # feature/calibration code depends on scikit-learn's exact API surface.
    # Bump these deliberately, re-running the oracle-parity test each time.
    "hvac-benchmark==0.1.0",
    "rdflib==7.6.0",
    "networkx==3.6.1",
    "numpy==2.5.3",
    "scikit-learn==1.7.2",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
# Only the data-generation side of this package (simulation.py / datasets.py)
# needs OpenStudio; deployed prediction (features.py / models.py /
# calibration.py / benchmark_adapter.py) must never require it. Keep this
# extra opt-in so a plain `pip install symptom-pipeline` never pulls in
# OpenStudio. Pinned to the exact version physics_pipeline/.venv has
# installed (3.11.0) -- physics_pipeline itself has no packaging metadata
# to pin against, so this is the only version pin available; if
# physics_pipeline's own .venv is ever upgraded, bump this to match and
# re-run the `physics`-marked tests.
physics = [
    "openstudio==3.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/symptom_pipeline"]

[tool.uv.sources]
hvac-benchmark = { path = "..", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: full end-to-end runs; excluded by default with -m 'not slow'",
    "physics: requires the physics_pipeline sibling checkout and OpenStudio; excluded by default with -m 'not physics'",
]
