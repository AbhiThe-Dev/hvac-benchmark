<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Service Call Assistant (live)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F4F0; --surface:#FFFFFF; --surface-2:#EFEBE4; --fg:#1C2430; --muted:#646F80; --border:#DCD6CC;
  --accent:#C2650C; --accent-fg:#FFFFFF; --good:#2F7A4F; --good-bg:#E6F2EA; --chip-bg:#FCEEDD; --chip-fg:#8A4A05;
  --live-bg:#E7F0FA; --live-fg:#1D5A96;
  --font-display:"IBM Plex Sans",system-ui,sans-serif; --font-body:"IBM Plex Sans",system-ui,sans-serif; --font-mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
body{background:var(--bg); color:var(--fg); font-family:var(--font-body); margin:0}
.wrap{max-width:560px; margin:0 auto; padding:0 16px 40px}
header.top{position:sticky; top:0; z-index:5; background:var(--bg); border-bottom:1px solid var(--border); padding:14px 16px; margin:0 -16px 20px}
header.top .row{max-width:560px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:12px}
header.top h1{font-family:var(--font-display); font-size:16px; font-weight:600; margin:0}
header.top .sub{font-size:12px; color:var(--muted); margin-top:2px}
.live-badge{display:inline-flex; align-items:center; gap:5px; font-family:var(--font-mono); font-size:11px; font-weight:600; color:var(--live-fg); background:var(--live-bg); border-radius:999px; padding:3px 9px}
.live-badge::before{content:""; width:6px; height:6px; border-radius:50%; background:var(--live-fg)}
.tally{display:flex; gap:14px; font-family:var(--font-mono); font-size:13px; color:var(--muted)}
.tally b{color:var(--fg); font-weight:600}
.card{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:20px; margin-bottom:16px}
.eyebrow{font-family:var(--font-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0 0 8px}
h2{font-family:var(--font-display); font-size:20px; margin:0 0 10px; line-height:1.3}
p.lead{color:var(--muted); font-size:14px; line-height:1.5; margin:0 0 4px}
.room-list{display:flex; flex-direction:column; gap:10px; margin:16px 0}
.room-row{display:flex; align-items:center; justify-content:space-between; background:var(--surface-2); border-radius:10px; padding:12px 14px}
.room-row .name{font-weight:600; font-size:14px}
.room-row .meta{font-family:var(--font-mono); font-size:12px; color:var(--muted)}
button.primary{font-family:var(--font-display); font-weight:600; font-size:15px; color:var(--accent-fg); background:var(--accent); border:none; border-radius:10px; padding:14px 18px; width:100%; cursor:pointer}
button.secondary{font-family:var(--font-display); font-weight:500; font-size:14px; color:var(--fg); background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:12px 16px; width:100%; cursor:pointer; margin-top:8px}
.question{font-size:16px; line-height:1.5; margin:0 0 10px}
.point-badge{display:inline-flex; align-items:center; gap:6px; font-family:var(--font-mono); font-size:12px; background:var(--surface-2); color:var(--fg); border:1px solid var(--border); border-radius:7px; padding:3px 8px; margin:2px 6px 2px 0}
.point-badge::before{content:"⌁"; color:var(--accent)}
.reading-note{font-size:13px; color:var(--muted); margin:0 0 14px}
.meter{height:6px; border-radius:4px; background:var(--surface-2); overflow:hidden; margin:4px 0 2px}
.meter > div{height:100%; background:var(--accent)}
.meter-label{font-family:var(--font-mono); font-size:12px; color:var(--muted); margin-bottom:14px}
.memo-chip{display:inline-flex; align-items:center; font-size:12px; font-weight:600; color:var(--chip-fg); background:var(--chip-bg); border-radius:999px; padding:4px 10px; margin-bottom:14px}
.answers{display:flex; flex-direction:column; gap:10px; margin-top:4px}
.answer-btn{font-family:var(--font-body); font-size:15px; font-weight:600; text-align:left; display:flex; align-items:center; justify-content:space-between; background:var(--surface); color:var(--fg); border:1.5px solid var(--border); border-radius:10px; padding:14px 16px; cursor:pointer}
.answer-btn:hover{border-color:var(--accent)}
.answer-btn .arrow{color:var(--accent); font-family:var(--font-mono)}
.carry{background:var(--good-bg); border:1px solid var(--good); border-radius:12px; padding:14px 16px; margin-bottom:16px}
.carry .eyebrow{color:var(--good)}
.carry ul{margin:6px 0 0; padding-left:18px; font-size:13px; line-height:1.6}
.conclude-badge{display:inline-flex; align-items:center; gap:8px; background:var(--good-bg); color:var(--good); font-weight:700; font-size:12px; letter-spacing:.04em; text-transform:uppercase; border-radius:999px; padding:5px 12px; margin-bottom:12px; font-family:var(--font-mono)}
.stat-row{display:flex; gap:18px; margin:14px 0 2px; font-family:var(--font-mono); font-size:13px; color:var(--muted)}
.stat-row b{color:var(--fg); font-size:15px; display:block; font-family:var(--font-body); font-weight:600}
.summary-grid{display:flex; flex-direction:column; gap:10px; margin:14px 0}
.summary-row{background:var(--surface-2); border-radius:10px; padding:12px 14px}
.summary-row .r-name{font-weight:600; font-size:14px; margin-bottom:2px}
.summary-row .r-concl{font-size:13px; color:var(--muted); line-height:1.4}
.big-stats{display:flex; gap:12px; margin:16px 0}
.big-stat{flex:1; background:var(--surface-2); border-radius:12px; padding:14px; text-align:center}
.big-stat .num{font-family:var(--font-mono); font-size:26px; font-weight:600}
.big-stat .lbl{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-top:2px}
.model-pick{display:flex; gap:8px; margin:6px 0 4px}
.model-pick button{flex:1; font-family:var(--font-body); font-size:13px; font-weight:600; background:var(--surface); color:var(--fg); border:1.5px solid var(--border); border-radius:10px; padding:10px 8px; cursor:pointer}
.model-pick button.on{border-color:var(--accent); background:var(--chip-bg)}
.model-note{font-size:12px; color:var(--muted); line-height:1.55; margin:6px 0 14px}
.model-note b{color:var(--fg); font-family:var(--font-mono)}
.context-note{font-size:13px; color:var(--muted); line-height:1.55; background:var(--surface-2); border-radius:10px; padding:12px 14px; margin-top:4px}
.footnote{font-size:11px; color:var(--muted); line-height:1.6; text-align:center; margin-top:28px; padding-top:16px; border-top:1px solid var(--border)}
.spinner{display:flex; justify-content:center; padding:30px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="row">
      <div>
        <h1>Service Call Assistant</h1>
        <div class="sub" id="subhead">Connecting&hellip;</div>
      </div>
      <div style="display:flex; flex-direction:column; align-items:flex-end; gap:6px">
        <span class="live-badge">LIVE ENGINE</span>
        <div class="tally" id="tally" hidden><span><b id="t-min">0</b> min</span><span><b id="t-checks">0</b> checks</span></div>
      </div>
    </div>
  </header>
  <main id="app"><div class="spinner">Loading&hellip;</div></main>
</div>
<script>
let rooms = [], info = null, model = 'mixed';
const app = document.getElementById('app');
const tally = document.getElementById('tally');

async function api(path, body){
  const res = await fetch(path, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body || {})});
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}

function fmtWord(w){ return w.charAt(0).toUpperCase() + w.slice(1); }

function parseQuestion(text){
  let point = null, reading = null;
  let main = text.replace(/\s*\(control-system point: ([^)]+)\)/, (m, p) => { point = p; return ''; });
  main = main.replace(/\s*\[([^\]]+)\]\s*$/, (m, r) => { reading = r; return ''; });
  return { main: main.trim(), point, reading };
}

function renderTally(min, checks){
  tally.hidden = false;
  document.getElementById('t-min').textContent = Math.round(min);
  document.getElementById('t-checks').textContent = checks;
}

let firstStep = null;

const hasModels = () => !!(info && info.models && info.prior);      // an older server (started before the two settings existed) sends neither: the page then simply has no picker

function modelNote(){
  const fam = {shipped: "The joint model exactly as shipped. It assumes about half of the rooms on a handler with low static pressure complain, so every <i>silent</i> room counts against a shared fault.",
               mixed: "The same model, but instead of one fixed share it considers four (5%, 15%, 50% or 90% of a handler's rooms affected) and lets the complaints pick. Nothing is tuned to this building. On a small handler like this one (8 rooms) the two settings make the same decisions; on large handlers the mixed setting finds shared faults the shipped one cannot."}[model];
  const p = info.prior['AHU-0'];
  return `${fam}<br>Before any check, the model puts <b>${Math.round(p.low_static * 1000) / 10}%</b> on low static pressure at AHU-0.`;
}

function renderIntro(){
  app.innerHTML = `
    <div class="card">
      <p class="eyebrow">Incoming visit</p>
      <h2>Two tenants, same air handler</h2>
      <p class="lead">Both rooms below are reported too warm. They're served by the same rooftop unit, AHU-0 &mdash; worth knowing before the first check is even chosen.</p>
      <div class="room-list">${rooms.map(r => `<div class="room-row"><span class="name">${r.name}</span><span class="meta">doc'd box ${r.documented_box}</span></div>`).join('')}</div>
      ${hasModels() ? `<p class="eyebrow" style="margin-top:6px">Model setting</p>
      <div class="model-pick">${info.models.map(m => `<button data-m="${m.key}" class="${m.key === model ? 'on' : ''}">${m.label}</button>`).join('')}</div>
      <div class="model-note">${modelNote()}</div>` : ''}
      <button class="primary" id="start-btn">Start the visit</button>
    </div>
    <div class="context-note">The tool picks one check at a time &mdash; whichever narrows things down the most per minute spent &mdash; and answers for one room can save time on the next.</div>
  `;
  app.querySelectorAll('.model-pick button').forEach(b => b.onclick = async () => { model = b.dataset.m; await boot(); });
  document.getElementById('start-btn').onclick = () => render(firstStep);
}

async function boot(){
  const d = await api('/api/start', {model});
  rooms = d.rooms;
  info = d;
  firstStep = d.step;
  document.getElementById('subhead').textContent = `${rooms[0].ahu} · ${rooms.length} complaints`;
  renderIntro();
}

function renderCheck(node){
  const q = parseQuestion(node.text);
  const pct = Math.round(node.p_pos * 100);
  const words = node.words;
  app.innerHTML = `
    <div class="card">
      <p class="eyebrow">Room ${node.room + 1} of ${rooms.length} &middot; ${rooms[node.room].name}</p>
      <p class="question">${q.main}</p>
      ${q.point ? `<div class="point-badge">${q.point}</div>` : ''}
      ${q.reading ? `<p class="reading-note">${q.reading}</p>` : ''}
      ${node.memo_note ? `<div class="memo-chip">SHARED ACROSS ROOMS &middot; ${node.memo_note}</div>` : ''}
      <div class="meter"><div style="width:${pct}%"></div></div>
      <div class="meter-label">~${pct}% likely to come back ${words[0]} &middot; about ${node.minutes} min</div>
      <div class="answers">${words.map(w => `<button class="answer-btn" data-word="${w}">${fmtWord(w)} <span class="arrow">&rarr;</span></button>`).join('')}</div>
    </div>
  `;
  app.querySelectorAll('.answer-btn').forEach(btn => { btn.onclick = () => act(() => api('/api/answer', {word: btn.dataset.word})); });
}

function renderQuestion(node){
  app.innerHTML = `
    <div class="card">
      <p class="eyebrow">Room ${node.room + 1} of ${rooms.length} &middot; ${rooms[node.room].name}</p>
      <div class="memo-chip">NO ATTRIBUTES ON FILE &middot; the technician has to be asked this directly</div>
      <p class="question">${node.text}</p>
      <div class="answers">${node.words.map(w => `<button class="answer-btn" data-word="${w}">${fmtWord(w)} <span class="arrow">&rarr;</span></button>`).join('')}</div>
    </div>
  `;
  app.querySelectorAll('.answer-btn').forEach(btn => { btn.onclick = () => act(() => api('/api/answer', {word: btn.dataset.word})); });
}

function renderConclude(node){
  renderTally(node.visit_minutes, node.visit_checks);
  app.innerHTML = `
    <div class="card">
      <span class="conclude-badge">${node.forced ? 'Best guess &mdash; check limit reached' : 'Diagnosed'}</span>
      <p class="eyebrow">${rooms[node.room].name}</p>
      <h2>${node.conclusion}</h2>
      <div class="stat-row">
        <div><b>${Math.round(node.belief * 100)}%</b>confidence</div>
        <div><b>${node.checks_so_far}</b>checks this room</div>
        <div><b>${node.minutes_so_far}</b>minutes this room</div>
      </div>
      ${node.forced ? `<p class="reading-note">No remaining check was confident enough to call this one outright, and this room hit its check limit. This is the tool's best guess at that point, not a settled conclusion.</p>` : ''}
      ${node.has_next && node.carried_into_next && node.carried_into_next.length ? `
        <div class="carry" style="margin-top:16px">
          <p class="eyebrow">Carried into ${node.next_room_name}, at no extra cost</p>
          <ul>${node.carried_into_next.map(c => `<li>${c}</li>`).join('')}</ul>
        </div>` : ''}
    </div>
    <button class="primary" id="next-btn">${node.has_next ? `Continue to ${node.next_room_name}` : 'See the visit summary'}</button>
  `;
  document.getElementById('next-btn').onclick = () => act(() => api('/api/advance'));
}

function renderVisitDone(d){
  app.innerHTML = `
    <div class="card">
      <span class="conclude-badge">Visit complete</span>
      <h2>Both complaints resolved</h2>
      <div class="big-stats">
        <div class="big-stat"><div class="num">${Math.round(d.visit_minutes)}</div><div class="lbl">Total minutes</div></div>
        <div class="big-stat"><div class="num">${d.visit_checks}</div><div class="lbl">Total checks</div></div>
        <div class="big-stat"><div class="num">${d.rooms.length}</div><div class="lbl">Rooms closed</div></div>
      </div>
      <div class="summary-grid">${d.conclusions.map(c => `<div class="summary-row"><div class="r-name">${d.rooms[c.room].name}</div><div class="r-concl">${c.conclusion}</div></div>`).join('')}</div>
      <div class="context-note">Because the two rooms shared an air handler, the second room reused readings already taken for the first instead of repeating them &mdash; that's the main reason the second diagnosis came in faster than the first.</div>
    </div>
    <button class="secondary" id="restart-btn">Run the visit again</button>
  `;
  document.getElementById('restart-btn').onclick = () => { tally.hidden = true; boot(); };
}

async function act(call){
  app.innerHTML = '<div class="spinner">Working&hellip;</div>';
  try {
    const d = await call();
    render(d.step);
  } catch (e) {
    app.innerHTML = `<div class="card"><h2>Something went wrong</h2><p class="lead">${e.message}</p></div>`;
  }
}

function render(step){
  if (step.kind === 'check') renderCheck(step);
  else if (step.kind === 'question') renderQuestion(step);
  else if (step.kind === 'conclude') renderConclude(step);
  else if (step.kind === 'visit_done') renderVisitDone(step);
  window.scrollTo({top:0, behavior:'smooth'});
}

boot().catch(e => { app.innerHTML = `<div class="card"><h2>Couldn't reach the server</h2><p class="lead">${e.message}</p></div>`; });
</script>
</body>
</html>
