[project]
name = "hotwater-dx"
version = "0.1.0"
description = "Physics-derived cause x check matrix for hot-water / recirculation complaints in commercial and multifamily buildings. Standalone: no dependency on the HVAC projects in this repository."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "numpy>=2.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hotwater_dx"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: full matrix builds; excluded by default with -m 'not slow'",
]
